name: app-cd

# Chạy sau khi app-ci push image thành công trên main.
on:
  workflow_run:
    workflows: [app-ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  bump-dev:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: imranismail/setup-kustomize@v2
      - name: Cập nhật image tag cho overlay dev
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REGISTRY: ${{ vars.ECR_REGISTRY }}   # <account_id>.dkr.ecr.<region>.amazonaws.com
        run: |
          TAG=${SHA::7}
          cd deploy/overlays/dev
          kustomize edit set image my-app=${REGISTRY}/my-app:${TAG}
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(deploy): dev -> ${GITHUB_SHA::7} [skip ci]"
          git push
