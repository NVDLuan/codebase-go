version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/order/adapter/postgres/queries.sql
    gen:
      go:
        package: db
        out: internal/order/adapter/postgres/db
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
