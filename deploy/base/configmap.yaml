# Chỉ chứa cấu hình KHÔNG nhạy cảm
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-app-config
data:
  APP_ENV: base
  LOG_LEVEL: info
  KAFKA_TOPIC: orders
