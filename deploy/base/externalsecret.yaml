# Tham chiếu AWS Secrets Manager, KHÔNG chứa giá trị thật
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: my-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager      # Tạo trong infra/modules/platform
  target:
    name: my-app-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: my-app/base           # Overlay patch thành my-app/<env>
