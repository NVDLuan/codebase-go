apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: my-app
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - configmap.yaml
  - externalsecret.yaml
labels:
  - pairs:
      app.kubernetes.io/name: my-app
      app.kubernetes.io/part-of: base-go
