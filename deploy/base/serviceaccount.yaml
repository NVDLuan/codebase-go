apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-app
  # Dùng EKS Pod Identity (association tạo trong infra/modules/iam) => không cần annotation.
  # Nếu dùng IRSA thì thêm:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account_id>:role/my-app-<env>
automountServiceAccountToken: false
