apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: patch-resources.yaml
  - path: patch-hpa.yaml
  - target: { kind: Ingress, name: my-app }
    patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: arn:aws:acm:ap-southeast-1:<account_id>:certificate/<prod-cert-id>
  - target: { kind: ExternalSecret, name: my-app }
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: my-app/prod
  - target: { kind: PodDisruptionBudget, name: my-app }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
configMapGenerator:
  - name: my-app-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=warn
images:
  - name: my-app
    newName: <account_id>.dkr.ecr.ap-southeast-1.amazonaws.com/my-app
    newTag: "0000000"   # Promote bằng PR đổi tag (cần approval)
